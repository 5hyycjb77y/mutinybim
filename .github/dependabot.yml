version: 2
# open-pull-requests-limit 0 pauses version updates (security updates still open).
# Raise the limits again once the launch has settled.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      dev-tooling:
        patterns: ["@types/*", "@typescript-eslint/*", "eslint", "jest", "jest-*", "typescript", "tsx", "esbuild"]
  - package-ecosystem: npm
    directory: /services/bim-authority
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /services/bim-authority
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
