name: DCO

# Every commit in a pull request carries a Developer Certificate of Origin
# sign-off (git commit -s). The DCO GitHub App enforces the same rule as a
# required check; this workflow explains a failure in the pull request log.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: Signed-off-by on every commit
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          rows=""
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author_email=$(git show -s --format='%ae' "$sha")
            if ! git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <${author_email}>$"; then
              echo "::error title=Missing sign-off::Commit $(git show -s --format='%h %s' "$sha") has no 'Signed-off-by:' line matching its author <${author_email}>."
              subject=$(git show -s --format='%s' "$sha" | sed 's/|/\\|/g; s/</\&lt;/g')
              rows="${rows}| \`$(git show -s --format='%h' "$sha")\` | ${subject} | \`${author_email}\` |"$'\n'
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "### Failed: commits without a matching Signed-off-by line"
              echo
              echo "| Commit | Subject | Author email the sign-off must match |"
              echo "| --- | --- | --- |"
              printf '%s' "$rows"
              echo
              echo "Fix: \`git rebase --signoff $BASE\` (or \`git commit --amend -s\` for one commit), then push again. See CONTRIBUTING.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Add a sign-off with: git commit --amend -s (or git rebase --signoff $BASE) and push again. See CONTRIBUTING.md."
            exit 1
          fi
          echo "Every commit is signed off."
